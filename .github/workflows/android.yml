name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Initialize Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        if ! ./gradlew assembleDebug --stacktrace > build.log 2>&1; then
          LINE=$(grep -n "processDebugResources" build.log | cut -d: -f1 | head -n 1)
          if [ -n "$LINE" ]; then
            START=$((LINE > 20 ? LINE - 20 : 1))
            sed -n "${START},$((LINE + 30))p" build.log | while IFS= read -r l; do
              echo "::error title=AAPT::$l"
            done
          else
            grep -i "error" build.log | head -n 30 | while IFS= read -r l; do
              echo "::error title=ERR::$l"
            done
          fi
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mtrack-sms-gateway-debug
        path: app/build/outputs/apk/debug/app-debug.apk
